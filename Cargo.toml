[package]
name = "sigmaos_initramfs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "SigmaOS initramfs builder with cpio/pack pipeline and hook planner"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
directories = "6"
flate2 = "1"
zstd = "0.14"

[lib]
name = "sigmaos_initramfs"
path = "src/lib.rs"
